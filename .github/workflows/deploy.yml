name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    permissions:
      contents: write # 赋予对仓库内容的写权限
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22"
          cache: pnpm

      - name: Install and Build
        env:
          PNPM_SUPPLY_CHAIN_POLICY: auto
        run: |
          npm install -g pnpm
          rm -rf node_modules pnpm-lock.yaml
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      # ============ 新增：部署到自己的 VPS 服务器 ===========
      - name: Deploy to VPS (宝塔)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # 创建临时私钥文件
          echo "$SSH_PRIVATE_KEY" > /tmp/id_rsa
          chmod 600 /tmp/id_rsa

          # 确保目标目录存在（宝塔默认网站根目录为 /www/wwwroot）
          # 这里假设 Admin 部署到 /www/wwwroot/admin，Seller 部署到 /www/wwwroot/seller
          # ssh -i /tmp/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "mkdir -p /www/wwwroot/admin /www/wwwroot/seller"

          # 同步 Admin 构建产物
          rsync -avz -e "ssh -i /tmp/id_rsa -o StrictHostKeyChecking=no" \
            ./dist/ $SERVER_USER@$SERVER_IP:/www/wwwroot/rhotheradm.kooki.com.cn/monorepo/

          # 同步 Seller 构建产物（因为我们的构建策略是将 seller 放在 dist/seller 下）
          rsync -avz -e "ssh -i /tmp/id_rsa -o StrictHostKeyChecking=no" \
            ./dist/seller/ $SERVER_USER@$SERVER_IP:/www/wwwroot/ehlucky/monorepo/seller/

          # 清理临时私钥
          rm -f /tmp/id_rsa
